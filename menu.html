<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>選單設計</title>
        <style> 
            ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    display: flex;
  }

  ul li {
    float: left;
  }

  ul li a {
    display: block;
    width: 120px;
    padding: 16px 10px;
    text-align: center;
    color: white;
    background-color: #6c7a89;
    text-decoration: none;
    font-weight: bold;
    border-radius: 14px 14px 0 0;
    margin-right: 10px;
    font-size: 14px;
  }

  ul li a:hover {
    background-color: #5a6678;
  }
</style>

    </head>

    <body>
        <ul>
            <li><a href="#">Serif</a></li>
            <li><a href="#">Sans-serif</a></li>
            <li><a href="#">Script</a></li>
            <li><a href="#">Display</a></li>
            <li><a href="#">Dingbats</a></li>
        </ul>
    </body>
</html>
